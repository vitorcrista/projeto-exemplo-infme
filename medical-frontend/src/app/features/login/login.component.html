<div class="login-wrapper">
  <div class="login-card">
    <h1>Entrar</h1>
    <p class="subtitle">Sistema de gestão de pacientes</p>

    <form (ngSubmit)="submit()" #form="ngForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          autocomplete="email"
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          autocomplete="current-password"
        />
      </div>

      @if (error) {
        <div class="error">{{ error }}</div>
      }

      <button type="submit" class="primary" [disabled]="loading || form.invalid">
        {{ loading ? 'A entrar…' : 'Entrar' }}
      </button>
    </form>

    <div class="demo">
      <div class="demo-title">Credenciais demo</div>
      @for (cred of demoCredentials; track cred.email) {
        <button type="button" class="demo-item" (click)="useDemo(cred)">
          <div class="demo-name">{{ cred.label }}</div>
          <div class="demo-creds">{{ cred.email }} · {{ cred.password }}</div>
        </button>
      }
    </div>
  </div>
</div>
